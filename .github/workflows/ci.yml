name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    name: Build and test (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v5
      - name: Build with warnings as errors, run tests
        run: make test CC=${{ matrix.cc }} EXTRA_CFLAGS=-Werror

  sanitizers:
    name: Sanitizers (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build with sanitizers, run tests
        run: make test EXTRA_CFLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=undefined"

  docs:
    name: Documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check every relative link and anchor
        run: make docs-check

  bench:
    name: Benchmark behind the CGNAT emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: make all bin/bench
      - name: Run the benchmark, publish the table in the run summary
        run: ./bin/bench | tee -a "$GITHUB_STEP_SUMMARY"
