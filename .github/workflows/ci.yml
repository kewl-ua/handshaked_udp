name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    name: Build (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v5
      - name: Build with warnings as errors
        run: make CC=${{ matrix.cc }} EXTRA_CFLAGS=-Werror
      - name: Smoke test
        run: sh tests/smoke.sh

  sanitizers:
    name: Sanitizers (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build with sanitizers
        run: make EXTRA_CFLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=undefined"
      - name: Smoke test
        run: sh tests/smoke.sh
